<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>GRE Flashcard by ansyaku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ea; --surface:#ffffff; --ink:#1f2630; --muted:#6b7280; --line:#e6e0d4; --foot:#faf8f3;
    --chip:#ffffff; --chip-line:#ddd6c8; --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 18px rgba(40,30,10,.07);
    --mudah:#e3a600;  --mudah-soft:#fff3c9;  --mudah-ink:#7a5800;
    --sedang:#1e9a5a; --sedang-soft:#dbf2e5; --sedang-ink:#11633a;
    --sulit:#2f6bff;  --sulit-soft:#e2eaff;  --sulit-ink:#1d46ad;
    --good:#1e9a5a; --bad:#d94b4b; --bad-soft:#fdeceb;
  }
  :root[data-theme="dark"]{
      --bg:#14171c; --surface:#1d2128; --ink:#e8eaee; --muted:#9aa2ae; --line:#2b3039; --foot:#191c22;
      --chip:#1d2128; --chip-line:#333943; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
      --mudah:#f0b90b;  --mudah-soft:#3a3013;  --mudah-ink:#ffd65c;
      --sedang:#2bb36c; --sedang-soft:#14321f; --sedang-ink:#74dda3;
      --sulit:#4f83ff;  --sulit-soft:#1a2747; --sulit-ink:#9db8ff;
      --good:#3cc77d; --bad:#ff6b6b; --bad-soft:#3a1d1f;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 20px 64px}

  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
  h1{font-size:clamp(26px,4vw,38px);font-weight:800;margin:0;letter-spacing:-.02em}
  .sub{color:var(--muted);margin:6px 0 0;font-size:15px}
  .user{display:flex;gap:8px;align-items:center;background:var(--chip);border:1px solid var(--chip-line);
    padding:5px 5px 5px 14px;border-radius:999px;font-size:14px;color:var(--muted)}
  .user input{border:0;background:var(--foot);border-radius:999px;padding:8px 14px;font:inherit;color:var(--ink);width:150px;outline:none}

  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .stat b{display:block;font-size:24px;font-weight:800}
  .stat span{font-size:13px;color:var(--muted)}
  .stat i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}

  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
  .tab{border:1px solid var(--chip-line);background:var(--chip);color:var(--ink);font:inherit;font-weight:600;font-size:14px;
    padding:9px 16px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .tab .dot{width:9px;height:9px;border-radius:50%}
  .tab small{color:var(--muted);font-weight:500}
  .tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .tab.on small{color:inherit;opacity:.7}

  .level-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;margin:30px 0 14px}
  .level-title .pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .deck{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:var(--shadow);transition:transform .15s ease, box-shadow .15s ease}
  .deck:hover{transform:translateY(-3px)}
  .deck::before{content:"";height:6px;background:var(--c)}
  .deck .body{padding:18px 20px 20px;flex:1}
  .deck .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;
    background:var(--soft);color:var(--cink)}
  .done{font-size:12px;font-weight:700;color:var(--cink)}
  .deck h3{margin:6px 0 4px;font-size:22px;font-weight:700;letter-spacing:-.01em}
  .deck .meta{color:var(--muted);font-size:13.5px;margin-bottom:14px}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar > div{height:100%;background:var(--c);border-radius:99px;transition:width .4s ease}
  .deck .last{font-size:12px;color:var(--muted);margin-top:10px;min-height:16px}
  .deck button{all:unset;cursor:pointer;display:block;text-align:center;padding:13px;background:var(--foot);
    border-top:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:600}
  .deck button:hover{background:var(--soft);color:var(--cink)}
  .mudah{--c:var(--mudah);--soft:var(--mudah-soft);--cink:var(--mudah-ink);--on-c:#3b2b00}
  .sedang{--c:var(--sedang);--soft:var(--sedang-soft);--cink:var(--sedang-ink)}
  .sulit{--c:var(--sulit);--soft:var(--sulit-soft);--cink:var(--sulit-ink)}

  .demo{margin-top:36px;color:var(--muted);font-size:12.5px;text-align:center}

  /* ===== Halaman latihan ===== */
  #latihan{max-width:760px;margin:0 auto}
  .ptop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .back{all:unset;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;padding:6px 0}
  .back:hover{color:var(--ink)}
  .ptitle{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
  .ptitle .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
  .pright{display:flex;align-items:center;gap:14px}
  .tally{font-size:14px;font-weight:700;display:flex;gap:12px}
  .tally .ok{color:var(--good)}.tally .no{color:var(--bad)}
  .early{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:var(--chip);border:1px solid var(--chip-line);
    padding:7px 12px;border-radius:999px;cursor:pointer}
  .early:hover{color:var(--ink);border-color:var(--ink)}

  .prog{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:18px}
  .prog .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px}
  .prog .row b{font-weight:700}
  .prog .row span{color:var(--muted)}
  .dots{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
  .dots i{flex:1;min-width:8px;height:6px;border-radius:3px;background:var(--line)}
  .dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.now{background:var(--ink)}

  .fc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .fc .head{position:relative;padding:56px 24px 52px;text-align:center}
  .fc .tag{position:absolute;top:16px;right:16px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);background:var(--foot);border:1px solid var(--line);padding:7px 12px;border-radius:6px}
  .fc .tag.lv{left:16px;right:auto;background:var(--soft);color:var(--cink);border-color:transparent}
  .fc .word{font-size:clamp(34px,7vw,52px);font-weight:600;letter-spacing:-.01em;word-break:break-word}
  .fc .reveal{all:unset;cursor:pointer;display:block;text-align:center;padding:16px;background:var(--foot);border-top:1px solid var(--line);
    color:var(--muted);font-size:15px;font-weight:500;width:100%;box-sizing:border-box}
  .fc .reveal:hover{background:var(--soft);color:var(--cink)}
  kbd{font:inherit;font-size:11px;border:1px solid var(--chip-line);border-radius:4px;padding:1px 6px;margin-left:8px;opacity:.75}

  .meaning{border-top:1px solid var(--line);background:var(--foot);padding:22px 26px 24px;animation:slide .25s ease}
  @keyframes slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .meaning .pos{display:inline-block;font-size:12px;font-weight:700;font-style:italic;color:var(--cink);background:var(--soft);
    padding:3px 10px;border-radius:999px;margin-bottom:10px}
  .meaning .def{font-size:18px;line-height:1.5;margin:0 0 18px}
  .meaning h4{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .meaning ol{margin:0;padding:0;list-style:none;counter-reset:n;display:grid;gap:10px}
  .meaning li{counter-increment:n;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;
    padding:11px 14px 11px 40px;position:relative;line-height:1.5;font-size:15px}
  .meaning li::before{content:counter(n);position:absolute;left:14px;top:11px;font-weight:700;color:var(--cink);font-size:14px}
  .meaning mark{background:var(--soft);color:var(--cink);font-weight:700;padding:0 3px;border-radius:3px}

  .answer{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .answer button,.finish{font:inherit;font-weight:700;font-size:15px;padding:15px;border-radius:12px;cursor:pointer;border:0;transition:transform .1s}
  .answer button:active,.finish:active{transform:scale(.98)}
  .answer .no{background:var(--surface);color:var(--bad);border:2px solid var(--bad-soft)}
  .answer .no:hover{background:var(--bad-soft)}
  .answer .ok{background:var(--c);color:var(--on-c,#fff)}
  .answer .ok:hover,.finish:hover{filter:brightness(1.06)}
  .answer small,.finish small{display:block;font-weight:500;font-size:11px;opacity:.75;margin-top:2px}

  .endcard{text-align:center;padding:44px 24px}
  .endcard h3{margin:0 0 6px;font-size:22px}
  .endcard p{margin:0 0 22px;color:var(--muted)}
  .finish{background:var(--c);color:var(--on-c,#fff);width:100%;max-width:340px;font-size:16px}

  .result{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 26px;text-align:center;box-shadow:var(--shadow)}
  .result .big{font-size:64px;font-weight:800;color:var(--cink);line-height:1}
  .result .big small{font-size:26px;color:var(--muted);font-weight:600}
  .result p{color:var(--muted);margin:10px 0 0}
  .result .note{display:inline-block;margin-top:12px;font-size:13px;font-weight:600;background:var(--soft);color:var(--cink);padding:5px 12px;border-radius:999px}
  .result .saved{font-size:13px;margin-top:14px;color:var(--muted)}
  .result .miss{text-align:left;margin:24px 0 0;border-top:1px solid var(--line);padding-top:18px}
  .result .miss h4{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips span{background:var(--bad-soft);color:var(--bad);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px}
  .result .acts{display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap}
  .result .acts button{font:inherit;font-weight:700;padding:12px 20px;border-radius:10px;cursor:pointer;border:0}
  .result .acts .pri{background:var(--c);color:var(--on-c,#fff)}
  .result .acts .sec{background:var(--foot);color:var(--ink);border:1px solid var(--line)}

  /* ===== Navigasi ===== */
  .topnav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-8px 0 28px;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .brand{font-weight:800;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  .brand i{display:inline-flex;gap:3px}.brand i b{width:8px;height:8px;border-radius:50%}
  .links{display:flex;gap:4px;align-items:center}
  .theme{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:6px 12px;cursor:pointer;margin-left:6px;display:flex;align-items:center;gap:6px}
  .theme:hover{color:var(--ink)}
  :root[data-theme="dark"]{color-scheme:dark}
  .links a{color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;padding:7px 14px;border-radius:999px}
  .links a:hover{color:var(--ink);background:var(--surface)}
  .links a.on{color:var(--bg);background:var(--ink)}

  /* ===== Rekap hasil ===== */
  .rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
  .rstats div{background:var(--foot);border:1px solid var(--line);border-radius:12px;padding:12px}
  .rstats b{display:block;font-size:26px;font-weight:800}
  .rstats span{font-size:12.5px;color:var(--muted)}
  .rstats .g b{color:var(--good)}.rstats .r b{color:var(--bad)}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  table{width:100%;border-collapse:collapse;font-size:14.5px;text-align:left}
  th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--foot);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
  tr:last-child td{border-bottom:0}
  td.w{font-weight:700;white-space:nowrap}
  td.j{color:var(--muted);font-style:italic;white-space:nowrap}

  /* ===== Riwayat ===== */
  #riwayat h1{margin-bottom:6px}
  .hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
  #riwayat .tbl-wrap{background:var(--surface);box-shadow:var(--shadow)}
  .dk{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
  .dk .badge{font-size:10px}
  .runs{display:flex;flex-wrap:wrap;gap:6px;max-width:440px}
  .runs span{font-size:12.5px;background:var(--foot);border:1px solid var(--line);border-radius:7px;padding:3px 8px;white-space:nowrap}
  .runs span b{color:var(--cink)}
  .num{font-weight:700;white-space:nowrap}
  .num small{display:block;font-weight:500;color:var(--muted);font-size:12px}
  .mini{height:5px;background:var(--line);border-radius:9px;margin-top:6px;width:90px;overflow:hidden}
  .mini div{height:100%;background:var(--c)}
  .empty{background:var(--surface);border:1px dashed var(--chip-line);border-radius:14px;padding:40px;text-align:center;color:var(--muted)}
  @media (max-width:700px){ .hstats{grid-template-columns:repeat(2,1fr)} }

  /* ===== Login ===== */
  #login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
  .lbox{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 30px;box-shadow:var(--shadow)}
  .lbox .dots3{display:flex;gap:5px;margin-bottom:18px}.lbox .dots3 b{width:12px;height:12px;border-radius:50%}
  .lbox h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
  .lbox .by{color:var(--muted);margin:4px 0 26px;font-size:14px}
  .lbox .by b{color:var(--ink)}
  .lbox label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}
  .lbox input{width:100%;font:inherit;font-size:15px;padding:12px 14px;border-radius:10px;border:1px solid var(--chip-line);background:var(--foot);color:var(--ink);margin-bottom:16px;outline:none}
  .lbox input:focus{border-color:var(--sulit);box-shadow:0 0 0 3px var(--sulit-soft)}
  .lbox button{width:100%;font:inherit;font-weight:700;font-size:15px;padding:13px;border-radius:10px;border:0;background:var(--ink);color:var(--bg);cursor:pointer;margin-top:4px}
  .lbox .err{color:var(--bad);font-size:13.5px;font-weight:600;min-height:20px;margin-top:12px;text-align:center}
  .shake{animation:shake .35s}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

  .brand small{font-weight:500;color:var(--muted);margin-left:2px}
  .who{font-size:13px;color:var(--muted);margin-left:6px;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .who b{color:var(--ink)}
  .who button{all:unset;cursor:pointer;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
  .who button:hover{color:var(--bad)}
  .links a .soon{font-size:10px;font-weight:700;background:var(--foot);border:1px solid var(--line);color:var(--muted);padding:1px 6px;border-radius:999px;margin-left:5px;vertical-align:1px}

  /* ===== Word Game ===== */
  .wg{--c:var(--ink);--soft:var(--foot);--cink:var(--muted)}
  .wg-note{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px dashed var(--chip-line);border-radius:14px;padding:14px 18px;margin:22px 0;color:var(--muted);font-size:14px}
  .wg-note b{color:var(--ink)}
  .wgcard{background:var(--surface);border:1px dashed var(--chip-line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;opacity:.85}
  .wgcard .body{padding:18px 20px 20px;flex:1}
  .wgcard h3{margin:10px 0 4px;font-size:22px;font-weight:700}
  .wgcard .meta{color:var(--muted);font-size:13.5px}
  .prog-badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--foot);border:1px solid var(--line);color:var(--muted)}
  .wgcard .foot{text-align:center;padding:13px;background:var(--foot);border-top:1px dashed var(--chip-line);color:var(--muted);font-size:14px;font-weight:600;cursor:not-allowed}

  .rfilter{display:flex;gap:8px;margin:-6px 0 16px}
  .runs span em{font-style:normal;color:var(--muted)}
  @media (max-width:820px){ .links{flex-wrap:wrap;justify-content:flex-end} .topnav{align-items:flex-start} }

  @media (max-width:700px){
    .summary{grid-template-columns:repeat(2,1fr)}
    .user input{width:120px}
    .ptitle{order:-1;width:100%}
  }
</style>
</head>
<body>
<div id="login" hidden>
  <form class="lbox" id="loginForm" autocomplete="off">
    <div class="dots3"><b style="background:var(--mudah)"></b><b style="background:var(--sedang)"></b><b style="background:var(--sulit)"></b></div>
    <h2>GRE Flashcard</h2>
    <p class="by">by <b>ansyaku</b> · 3.083 kata dalam 123 deck</p>
    <label for="inNama">Nama</label>
    <input id="inNama" placeholder="Nama kamu" required maxlength="40">
    <label for="inKode">Kode akses</label>
    <input id="inKode" type="password" placeholder="Masukkan kode" required>
    <button type="submit">Masuk →</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>
<div class="wrap">
  <nav class="topnav">
    <span class="brand"><i><b style="background:var(--mudah)"></b><b style="background:var(--sedang)"></b><b style="background:var(--sulit)"></b></i>GRE Flashcard <small>by ansyaku</small></span>
    <div class="links">
      <a href="#" data-v="beranda" class="on">Deck</a>
      <a href="#" data-v="wordgame">Word Game<span class="soon">soon</span></a>
      <a href="#" data-v="riwayat">Riwayat</a>
      <button class="theme" id="theme" title="Ganti mode terang/gelap"></button>
      <span class="who">Hai, <b id="namaTampil"></b> · <button onclick="logout()">Keluar</button></span>
    </div>
  </nav>
  <section id="riwayat" hidden></section>
  <section id="wordgame" hidden></section>
  <section id="latihan" hidden></section>
  <div id="beranda">
  <header>
    <div>
      <h1>GRE Flashcard</h1>
      <p class="sub">Pilih deck, latihan 25 kata, skor tersimpan otomatis.</p>
    </div>
  </header>

  <section class="summary" id="summary"></section>
  <nav class="tabs" id="tabs"></nav>
  <main id="decks"></main>

  <p class="demo" id="demoNote">Mode pratinjau: progres di atas hanya contoh. Setelah URL Apps Script diisi, angkanya diambil dari Google Sheets.</p>
  </div>
</div>

<script>
// ===== Pengaturan =====
const API = ''; // isi dengan URL /exec dari Apps Script
const UKURAN_DECK = 25;
const LEVEL = [
  { key:'mudah',  label:'Mudah',  total:436  },
  { key:'sedang', label:'Sedang', total:1542 },
  { key:'sulit',  label:'Sulit',  total:1105 },
];

// Bagi rata: jumlah deck = round(total/25), sisa kata disebar ke deck awal
function bagiDeck(total){
  const n = Math.max(1, Math.round(total / UKURAN_DECK));
  const base = Math.floor(total / n), sisa = total % n;
  return Array.from({length:n}, (_,i) => base + (i < sisa ? 1 : 0));
}

const decks = LEVEL.flatMap(L =>
  bagiDeck(L.total).map((jumlah,i) => ({
    id: `${L.key}-${String(i+1).padStart(2,'0')}`,
    level: L.key, label: L.label, nomor: i+1, jumlah,
    dikuasai: 0, terakhir: ''
  }))
);

let filter = 'semua';
const $ = s => document.querySelector(s);
const fmtNum = n => n.toLocaleString('id-ID');

let sesi = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tandai = (kalimat, kata) =>
  esc(kalimat).replace(new RegExp(`\\b(${kata.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\w*)`, 'gi'), '<mark>$1</mark>');

async function ambilKata(deckId){
  if (!API) return CONTOH_KATA;

}

async function mulai(id){

  $('#latihan').innerHTML = '<p style="color:var(--muted);text-align:center;margin-top:60px">Memuat kata…</p>';

}

function tampil(v){

function bolehPindah(){

}
document.querySelectorAll('.links a').forEach(a => a.onclick = e => {

function renderLatihan(){
  const { deck, kata, i, jawaban } = sesi;
  const total = kata.length;
  const benar = jawaban.filter(j=>j.benar).length, salah = jawaban.length - benar;
  const semua = jawaban.length >= total;
  const judul = `<div class="ptop">
      <button class="back" onclick="keluar()">← Semua deck</button>
      <div class="ptitle"><span class="dot"></span>${deck.label} · Deck ${String(deck.nomor).padStart(2,'0')}</div>
      <div class="pright">
        <div class="tally"><span class="ok">✓ ${benar}</span><span class="no">✗ ${salah}</span></div>
        ${!sesi.selesai && !semua ? `<button class="early" onclick="selesaiAwal()">Selesai lebih awal</button>` : ''}
      </div>
    </div>`;

  if (sesi.selesai) return renderHasil(judul);

  const titik = kata.map((_,n)=>`<i class="${n<jawaban.length?(jawaban[n].benar?'ok':'no'):n===i&&!semua?'now':''}"></i>`).join('');
  const prog = `<div class="prog">
      <div class="row"><b>${semua?`${total} dari ${total} kartu dijawab`:`Kartu ${i+1} dari ${total}`}</b>
        <span>${semua?'Tidak ada sisa':`Sisa ${total-i-1} kartu`}</span></div>
      <div class="bar"><div style="width:${jawaban.length/total*100}%"></div></div>
      <div class="dots">${titik}</div>
    </div>`;

  // semua kartu sudah dijawab → tombol Selesai
  if (semua){
    $('#latihan').innerHTML = `${judul}${prog}
      <article class="fc"><div class="endcard">
        <h3>Itu kartu terakhir</h3>
        <p>Kamu sudah menjawab semua ${total} kartu di deck ini.</p>
        <button class="finish" onclick="selesai()">Selesai →<small>tekan Enter</small></button>
      </div></article>`;
    return;
  }

  const k = kata[i];
  $('#latihan').innerHTML = `${judul}${prog}
    <article class="fc">
      <div class="head">
        <span class="tag lv">${deck.label}</span>
        <span class="tag">${k.baru===false?'Ulangan':'Kata baru'}</span>
        <div class="word">${esc(k.kata)}</div>
      </div>
      ${sesi.buka ? `
        <div class="meaning">
          ${k.jenis?`<span class="pos">${esc(k.jenis)}</span>`:''}
          <p class="def">${esc(k.arti)}</p>
          <h4>Contoh kalimat</h4>
          <ol>${(k.contoh||[]).filter(Boolean).map(c=>`<li>${tandai(c,k.kata)}</li>`).join('')}</ol>
        </div>`
      : `<button class="reveal" onclick="buka()">Lihat arti →<kbd>Spasi</kbd></button>`}
    </article>
    ${sesi.buka ? `
      <div class="answer">
        <button class="no" onclick="jawab(false)">Belum hafal<small>tekan 1</small></button>
        <button class="ok" onclick="jawab(true)">Sudah tahu<small>tekan 2</small></button>
      </div>` : ''}`;
}

function buka(){ if (!sesi.buka){ sesi.buka = true; renderLatihan(); } }

function jawab(b){
  sesi.jawaban.push({ suku: sesi.kata[sesi.i].kata, benar: b });
  sesi.buka = false;
  if (sesi.i + 1 < sesi.kata.length) sesi.i++;
  renderLatihan();
}

function selesai(){
  sesi.selesai = true;
  renderLatihan();
  simpan();
}

function selesaiAwal(){
  const n = sesi.jawaban.length;
  if (n === 0){
    if (confirm('Belum ada kartu yang dijawab. Keluar dari deck ini?')) keluar();
    return;
  }
  if (confirm(`Selesai sekarang? ${n} kartu yang sudah dijawab akan disimpan.`)) {
    sesi.awal = true;
    selesai();
  }
}

function renderHasil(judul){
  const { kata, jawaban } = sesi;
  const n = jawaban.length;
  const benar = jawaban.filter(j=>j.benar).length, salahN = n - benar;
  const pct = n ? Math.round(benar/n*100) : 0;
  const salah = jawaban.map((j,i)=> j.benar ? null : kata[i]).filter(Boolean);
  const pesan = sesi.awal ? 'Lanjutkan sisanya lain kali.'
    : benar===n ? 'Sempurna! Semua kata di deck ini sudah kamu tahu.'
    : benar>=n*.7 ? 'Bagus, tinggal sedikit lagi.'
    : 'Tidak apa-apa, ulangi besok supaya lebih menempel.';
  $('#latihan').innerHTML = `${judul}
    <div class="result">
      <div class="big">${benar}<small> / ${n}</small></div>
      <p>${pesan}</p>
      ${sesi.awal ? `<span class="note">Selesai lebih awal · ${n} dari ${kata.length} kartu dijawab</span>` : ''}
      <div class="rstats">
        <div class="g"><b>${benar}</b><span>Benar</span></div>
        <div class="r"><b>${salahN}</b><span>Salah</span></div>
        <div><b>${pct}%</b><span>Skor</span></div>
      </div>
      <div class="saved" id="statusSimpan">${API?'Menyimpan…':'Mode pratinjau: skor tidak dikirim ke Google Sheets.'}</div>
      ${salah.length ? `<div class="miss"><h4>Kata yang salah (${salah.length})</h4>
        <div class="tbl-wrap"><table>
          <thead><tr><th>#</th><th>Kata</th><th>Jenis</th><th>Arti</th></tr></thead>
          <tbody>${salah.map((k,i)=>`<tr><td>${i+1}</td><td class="w">${esc(k.kata)}</td><td class="j">${esc(k.jenis||'')}</td><td>${esc(k.arti||'')}</td></tr>`).join('')}</tbody>
        </table></div></div>` : ''}
      <div class="acts">
        <button class="pri" onclick="mulai('${sesi.deck.id}')">Ulangi deck ini</button>
        <button class="sec" onclick="bukaRiwayat()">Lihat riwayat</button>
        <button class="sec" onclick="keluar()">Kembali ke semua deck</button>
      </div>
    </div>`;
}

async function simpan(){
  const benar = sesi.jawaban.filter(j=>j.benar).length;
  // perbarui kartu di beranda
  sesi.deck.dikuasai = Math.max(sesi.deck.dikuasai, benar);
  sesi.deck.terakhir = new Date().toLocaleDateString('sv-SE');
  riwayatLokal.push({ tiket: riwayatLokal.length+1, nama: namaUser(), tanggal: new Date().toLocaleString('sv-SE').slice(0,16),
    paket: sesi.deck.id, skor: benar, total: sesi.jawaban.length });
  if (!API) return;
  try {
    const r = await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ nama: namaUser(), paket: sesi.deck.id, total: sesi.jawaban.length, jawaban: sesi.jawaban }) });
    const d = await r.json();
    const el = document.getElementById('statusSimpan');
    if (el) el.textContent = d.ok ? `Tersimpan sebagai tiket #${d.tiket}` : `Gagal menyimpan: ${d.error}`;
  } catch(e){
    const el = document.getElementById('statusSimpan');
    if (el) el.textContent = 'Gagal menyimpan, periksa koneksi.';
  }
}

const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const tgl = t => { const [d] = String(t).split(' '); const [y,m,dd] = d.split('-'); return `${+dd} ${BULAN[m-1]}`; };

async function bukaRiwayat(){
  sesi = null;
  tampil('riwayat');
  const el = $('#riwayat');
  el.innerHTML = '<h1>Riwayat</h1><p class="sub">Memuat…</p>';
  let data = riwayatLokal;
  if (API){
    try {
      const r = await fetch(`${API}?action=riwayat&limit=5000`);
      data = (await r.json()).sesi || [];
    } catch(e){ el.innerHTML = '<h1>Riwayat</h1><p class="sub">Gagal memuat riwayat. Periksa koneksi.</p>'; return; }
  }
  renderRiwayat(data);
}

let filterRiwayat = 'saya', dataRiwayat = [];
function renderRiwayat(data){
  if (data) dataRiwayat = data;
  data = filterRiwayat === 'saya' ? dataRiwayat.filter(r => (r.nama||'') === namaUser()) : dataRiwayat;
  const urut = id => decks.findIndex(d=>d.id===id);
  const grup = {};
  data.forEach(r => (grup[r.paket] = grup[r.paket] || []).push(r));
  const baris = Object.entries(grup)
    .map(([id, list]) => {
      const deck = decks.find(d=>d.id===id);
      list.sort((a,b)=> String(a.tanggal).localeCompare(String(b.tanggal)));
      const tot = r => Number(r.total) || deck?.jumlah || 25;
      const rata = list.reduce((a,r)=>a + r.skor/tot(r), 0) / list.length;
      return { id, deck, list, rata, akhir: list[list.length-1], tot };
    })
    .sort((a,b)=> urut(a.id) - urut(b.id));

  const totalSesi = data.length;
  const rataAll = totalSesi ? data.reduce((a,r)=>a + r.skor/(Number(r.total)||25),0)/totalSesi : 0;
  const terakhir = data.map(r=>r.tanggal).sort().pop();

  $('#riwayat').innerHTML = `
    <h1>Riwayat</h1>
    <p class="sub">Semua sesi latihan per deck.</p>
    <div class="tabs rfilter" style="margin-top:18px">
      <button class="tab ${filterRiwayat==='saya'?'on':''}" onclick="filterRiwayat='saya';renderRiwayat()">Punya saya</button>
      <button class="tab ${filterRiwayat==='semua'?'on':''}" onclick="filterRiwayat='semua';renderRiwayat()">Semua orang</button>
    </div>
    <div class="hstats">
      <div class="stat"><b>${totalSesi}</b><span>sesi latihan</span></div>
      <div class="stat"><b>${baris.length}<span style="font-size:14px;font-weight:500"> / ${decks.length}</span></b><span>deck pernah dikerjakan</span></div>
      <div class="stat"><b>${Math.round(rataAll*100)}%</b><span>rata-rata skor</span></div>
      <div class="stat"><b>${terakhir ? tgl(terakhir) : '-'}</b><span>latihan terakhir</span></div>
    </div>
    ${baris.length ? `<div class="tbl-wrap"><table>
      <thead><tr><th>Deck</th><th>Dikerjakan</th><th>Tanggal, skor &amp; oleh</th><th>Rata-rata</th><th>Skor terakhir</th></tr></thead>
      <tbody>${baris.map(b => {
        const lv = b.deck?.level || '', ak = b.akhir;
        return `<tr class="${lv}">
          <td><div class="dk"><span class="badge">${b.deck?.label||'?'}</span>Deck ${b.deck?String(b.deck.nomor).padStart(2,'0'):esc(b.id)}</div></td>
          <td class="num">${b.list.length}×</td>
          <td><div class="runs">${b.list.map(r=>`<span>${tgl(r.tanggal)} · <b>${r.skor}/${b.tot(r)}</b> · <em>${esc(r.nama||'-')}</em></span>`).join('')}</div></td>
          <td class="num">${Math.round(b.rata*100)}%<div class="mini"><div style="width:${b.rata*100}%"></div></div></td>
          <td class="num">${ak.skor}/${b.tot(ak)}<small>${tgl(ak.tanggal)}</small></td>
        </tr>`; }).join('')}</tbody>
    </table></div>` : `<div class="empty">Belum ada latihan yang tersimpan${filterRiwayat==='saya'?' atas namamu':''}. Pilih deck di halaman Deck untuk mulai.</div>`}`;
}

function keluar(){ sesi = null; tampil('beranda'); render(); }

document.addEventListener('keydown', e => {
  if (!sesi || sesi.selesai || e.target.tagName === 'INPUT') return;
  const semua = sesi.jawaban.length >= sesi.kata.length;
  if (semua && e.key === 'Enter') { e.preventDefault(); selesai(); }
  else if (!semua && !sesi.buka && (e.code === 'Space' || e.key === 'Enter')) { e.preventDefault(); buka(); }
  else if (sesi.buka && e.key === '1') jawab(false);
  else if (sesi.buka && e.key === '2') jawab(true);
  else if (e.key === 'Escape') keluar();
});

const KODE = 'BagiDong';
