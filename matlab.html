<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basic MATLAB, Andreas Syaloom Kurniawan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e4e5e9;        /* abu pastel */
    --surface:#eff0f3;
    --line:#cfd1d7;
    --ink:#23373b;       /* teal gelap, senada header slide */
    --muted:#69767a;
    --accent:#eb811b;    /* oranye, senada aksen slide */
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{background:var(--bg)}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 "Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:48px 20px 56px}

  .masthead h1{font-size:clamp(34px,6vw,52px);line-height:1.05;font-weight:700;margin:0 0 14px;letter-spacing:-.01em}
  .masthead p{margin:0;color:var(--muted)}
  .masthead .author{color:var(--ink);font-weight:500}

  .materi{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:36px 0 16px}
  .materi button{
    font:inherit;color:inherit;text-align:left;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:baseline;
  }
  .materi button:hover{border-color:var(--muted)}
  .materi button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#f2f3f5}
  .materi .no{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .materi .t{font-weight:500}
  .materi .d{grid-column:2;font-size:14px;opacity:.75}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .viewer{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .frame{position:relative;aspect-ratio:16/9;background:#fafafa;display:flex;align-items:center;justify-content:center}
  .frame img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;opacity:0;transition:opacity .15s}
  .frame img.ready{opacity:1}
  .shield{position:absolute;inset:0;cursor:pointer}
  .progress{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .2s}
  .msg{position:absolute;color:var(--muted);padding:20px;text-align:center}

  .controls{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
  .controls button{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 14px;cursor:pointer}
  .controls button:hover:not(:disabled){border-color:var(--muted)}
  .controls button:disabled{opacity:.4;cursor:default}
  .count{min-width:76px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
  .controls .fs{margin-left:auto}

  .viewer:fullscreen{border:0;border-radius:0;display:flex;flex-direction:column;background:#1d2a2d}
  .viewer:fullscreen .frame{flex:1;aspect-ratio:auto;background:#1d2a2d}
  .viewer:fullscreen .controls{background:var(--surface)}

  footer{margin-top:28px;font-size:14px;color:var(--muted)}

  @media (max-width:640px){
    .wrap{padding-top:32px}
    .materi{grid-template-columns:1fr}
    .controls .fs{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media print{body *{display:none!important}body::after{content:"Materi ini tidak dapat dicetak.";display:block;padding:40px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>Basic MATLAB</h1>
    <p class="author">Andreas Syaloom Kurniawan</p>
    <p>Fakultas Ekonomika dan Bisnis, Universitas Gadjah Mada</p>
  </header>

  <nav class="materi" aria-label="Pilih materi" id="materi"></nav>

  <section class="viewer" id="viewer" aria-label="Penampil slide">
    <div class="frame">
      <img id="img" alt="" draggable="false">
      <p class="msg" id="msg">Memuat slide…</p>
      <div class="shield" id="shield" title="Klik kiri untuk mundur, kanan untuk maju"></div>
      <div class="progress" id="progress" style="width:0"></div>
    </div>
    <div class="controls">
      <button id="prev" type="button">Sebelumnya</button>
      <span class="count" id="count">– / –</span>
      <button id="next" type="button">Berikutnya</button>
      <button id="fs" class="fs" type="button">Layar penuh</button>
    </div>
  </section>

  <footer>Gunakan tombol panah keyboard atau geser layar untuk berpindah slide.</footer>
</div>

<script>
/* ===== Daftar materi: tambah entri baru di sini ===== */
const MATERI = [
  { no:"03a", judul:"Indexing matriks", ket:"magic(), akses elemen, eye/triu/tril, sum()", folder:"slides/indexing/", jumlah:22 },
  { no:"03b", judul:"Operasi matriks",  ket:"Penjumlahan, perkalian, transpose, determinan, invers, eigen", folder:"slides/operasi/", jumlah:15 },
];
/* ==================================================== */

const $ = id => document.getElementById(id);
const img = $("img");
let m = 0, page = 1;

const src = (mi, n) => {
  const x = MATERI[mi];
  return x.folder + "slide-" + String(n).padStart(String(x.jumlah).length, "0") + ".jpg";
};

// tombol materi
$("materi").innerHTML = MATERI.map((x,i) =>
  `<button type="button" data-i="${i}" aria-pressed="false">
     <span class="no">${x.no}</span><span class="t">${x.judul}</span>
     <span class="d">${x.ket} (${x.jumlah} slide)</span>
   </button>`).join("");
$("materi").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  pilih(+b.dataset.i, 1);
};

function pilih(i, n){
  m = i; page = n;
  document.querySelectorAll("#materi button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.i === m));
  img.alt = MATERI[m].judul;
  history.replaceState(null, "", `#${MATERI[m].no}-${page}`);
  render();
}

function render(){
  const total = MATERI[m].jumlah;
  img.classList.remove("ready");
  img.src = src(m, page);
  $("count").textContent = `${page} / ${total}`;
  $("prev").disabled = page <= 1; $("next").disabled = page >= total;
  $("progress").style.width = (page/total*100) + "%";
  history.replaceState(null, "", `#${MATERI[m].no}-${page}`);
  [page-1, page+1].forEach(k => { if (k >= 1 && k <= total) new Image().src = src(m, k); });
}
img.onload  = () => { img.classList.add("ready"); $("msg").hidden = true; };
img.onerror = () => { $("msg").hidden = false; $("msg").textContent = "Slide tidak ditemukan: " + src(m, page); };

const go = d => { const n = page + d; if (n >= 1 && n <= MATERI[m].jumlah){ page = n; render(); } };

$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("shield").onclick = e => go(e.offsetX < e.currentTarget.clientWidth/2 ? -1 : 1);

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && ["s","p","u"].includes(k)){ e.preventDefault(); return; }
  if (["arrowright","pagedown"].includes(k)){ e.preventDefault(); go(1); }
  if (["arrowleft","pageup"].includes(k)){ e.preventDefault(); go(-1); }
});

$("fs").onclick = () => document.fullscreenElement ? document.exitFullscreen() : $("viewer").requestFullscreen?.();
document.addEventListener("fullscreenchange", () =>
  $("fs").textContent = document.fullscreenElement ? "Keluar layar penuh" : "Layar penuh");

let x0 = null;
$("shield").addEventListener("touchstart", e => x0 = e.touches[0].clientX, {passive:true});
$("shield").addEventListener("touchend", e => {
  if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); x0 = null;
});

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());

// buka dari link, misal #03b-4
const h = location.hash.slice(1).split("-");
const mi = MATERI.findIndex(x => x.no === h[0]);
pilih(mi >= 0 ? mi : 0, Math.min(Math.max(parseInt(h[1]) || 1, 1), MATERI[mi >= 0 ? mi : 0].jumlah));
</script>
</body>
</html>
